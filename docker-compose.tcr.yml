services:
  textura:
    image: ${TEXTURA_IMAGE:?Set TEXTURA_IMAGE in .env.tcr}
    container_name: textura-web
    restart: always
    pull_policy: always
    environment:
      - NODE_ENV=production
    networks:
      - textura-net

  nginx:
    image: nginx:alpine
    container_name: textura-nginx
    restart: always
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - textura
    networks:
      - textura-net

networks:
  textura-net:
    driver: bridge
