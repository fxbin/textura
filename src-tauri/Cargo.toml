[package]
name = "textura"
version = "1.0.0"
description = "Textura - 公众号排版工具"
authors = ["Textura Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "textura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2.3.5"
