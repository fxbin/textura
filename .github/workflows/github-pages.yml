name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify custom-domain config
        if: ${{ vars.CUSTOM_DOMAIN == 'true' }}
        run: |
          if [ -z "${{ vars.DOMAIN_NAME }}" ]; then
            echo "::error::CUSTOM_DOMAIN=true 但未配置 DOMAIN_NAME 仓库变量。"
            echo "::error::请在 Settings → Secrets and variables → Actions → Variables 添加 DOMAIN_NAME，或将 CUSTOM_DOMAIN 改为 false。"
            exit 1
          fi

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
        run: npm run build

      - name: Add CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN == 'true' }}
        run: echo "${{ vars.DOMAIN_NAME }}" > out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
