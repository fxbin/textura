name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.platform == 'windows-latest' && contains(github.ref_name, '-') && '--bundles nsis' || '' }}
          releaseName: 'Textura v__VERSION__'
          releaseBody: |
            ## Textura Beta

            发布前请根据仓库根目录 `RELEASE_NOTES_BETA.md` 补充本次版本说明。

            ### 已知限制
            - 自定义主题复制到微信不保证完全保真
            - PDF 当前依赖浏览器 / 系统打印链路
            - AI 配置保存在本地，不做云同步
            - 历史快照与恢复为本地单机能力
            - 当前发布流程主要覆盖 Windows / macOS
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
