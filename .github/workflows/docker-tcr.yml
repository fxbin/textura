name: Docker TCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Lighthouse after pushing the image"
        required: true
        type: boolean
        default: false
      image_tag:
        description: "Optional extra image tag for manual publish"
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE || 'textura' }}/${{ secrets.TCR_REPOSITORY || 'me' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTHOUSE_HOST }}
          username: ${{ secrets.LIGHTHOUSE_USER }}
          key: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
          port: ${{ secrets.LIGHTHOUSE_PORT || '22' }}
          target: ${{ secrets.LIGHTHOUSE_DEPLOY_PATH }}
          source: "docker-compose.tcr.yml,DEPLOY_DOCKER.md,nginx/default.conf,scripts/update-from-tcr.sh"

      - name: Update server containers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTHOUSE_HOST }}
          username: ${{ secrets.LIGHTHOUSE_USER }}
          key: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
          port: ${{ secrets.LIGHTHOUSE_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.LIGHTHOUSE_DEPLOY_PATH }}"
            chmod +x scripts/update-from-tcr.sh
            ./scripts/update-from-tcr.sh docker-compose.tcr.yml .env.tcr
